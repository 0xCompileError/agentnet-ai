[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentnet"
version = "0.1.0"
description = "A Python framework for trainable networks of ReAct agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "AgentNet Contributors" },
]
dependencies = [
  "anyio>=4.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/0xCompileError/agentnet-ai"
Repository = "https://github.com/0xCompileError/agentnet-ai.git"
Issues = "https://github.com/0xCompileError/agentnet-ai/issues"

[project.scripts]
agentnet = "agentnet.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pyright>=1.1.400",
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
packages = ["src/agentnet"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/agentnet/**",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["agentnet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
